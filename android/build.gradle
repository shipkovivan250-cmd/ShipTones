plugins {
    id 'com.android.application' version '8.2.0'
    id 'org.jetbrains.kotlin.android' version '1.9.20'
    id 'com.chaquo.python' version '17.2.0'
}

android {
    namespace 'com.shiptones.app'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        buildToolsVersion '34.0.0'

        // Allow debug info viewing in Chaquopy.
        testBuildType 'debug'

        ndk {
            abiFilters = ["arm64-v8a", "x86_64"]
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main {
            assets { srcDirs = ['assets'] }
            res { srcDirs = ['res'] }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'MissingPermission', 'UnusedResources', 'InvalidPackage'
    }
}

chaquopy {
    defaultConfig {
        version = "3.10"
        pip {
            install("yt-dlp")
            install("mutagen")
            install("Pillow")
        }
    }
    sourceSets {
        getByName("main") {
            srcDir("../")
        }
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.20'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.6.1'
    implementation 'com.arthenica:mobile-ffmpeg-full:6.0.1'
}
