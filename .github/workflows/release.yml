name: Release

# Публикует GitHub Release с собранным ShipTones.exe при пуше тега вида v1.2.0.
# Приложение сверяет свою версию (config.APP_VERSION) с последним Release
# через публичный GitHub API и предлагает обновиться — см. updater.py.
#
# Как выпустить новую версию:
#   1. Подними config.APP_VERSION в коде (например, до "1.2.0").
#   2. git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg (static build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extracted
          $ffmpegExe = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination ffmpeg.exe

      - name: Build EXE (onefile, with bundled ffmpeg and web UI)
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name ShipTones `
            --add-binary "ffmpeg.exe;." `
            --add-data "web;web" `
            --collect-all pywebview `
            --collect-all pythonnet `
            --collect-all clr_loader `
            main.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ShipTones ${{ github.ref_name }}"
          files: dist/ShipTones.exe
          generate_release_notes: true
