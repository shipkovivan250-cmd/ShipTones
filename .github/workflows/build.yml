name: Build ShipTones for Windows

on:
  workflow_dispatch:        # запустить вручную кнопкой в вкладке Actions
  push:
    tags:
      - 'v*'                 # Авто-релиз при создании тега v1.0.0, v2.3.1 и т.д.
    branches: [ "main" ]
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg (static build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extracted
          $ffmpegExe = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination ffmpeg.exe

      - name: Build EXE (onefile, with bundled ffmpeg and web UI)
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name ShipTones `
            --add-binary "ffmpeg.exe;." `
            --add-data "web;web" `
            --hidden-import=yt_dlp `
            --hidden-import=mutagen `
            --hidden-import=PIL `
            --hidden-import=mutagen.mp3 `
            --hidden-import=mutagen.mp4 `
            --hidden-import=mutagen.flac `
            --hidden-import=mutagen.ogg `
            --collect-all pywebview `
            --collect-all pythonnet `
            --collect-all clr_loader `
            --clean `
            --noconfirm `
            main.py

      - name: Create Releases directory
        run: mkdir -p Releases

      - name: Copy executable to Releases
        run: copy dist\ShipTones.exe Releases\ShipTones.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShipTones-Windows
          path: Releases/ShipTones.exe

      - name: Create GitHub Release (auto on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: Releases/ShipTones.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
