name: Build ShipTones for All Platforms

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches: [ "main" ]
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/build.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg (static build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extracted
          $ffmpegExe = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination ffmpeg.exe

      - name: Build EXE (onefile, with bundled ffmpeg and web UI)
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name ShipTones `
            --add-binary "ffmpeg.exe;." `
            --add-data "web;web" `
            --hidden-import=yt_dlp `
            --hidden-import=mutagen `
            --hidden-import=PIL `
            --hidden-import=mutagen.mp3 `
            --hidden-import=mutagen.mp4 `
            --hidden-import=mutagen.flac `
            --hidden-import=mutagen.ogg `
            --collect-all pywebview `
            --collect-all pythonnet `
            --collect-all clr_loader `
            --clean `
            --noconfirm `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShipTones-Windows
          path: dist/ShipTones.exe

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable (onefile, with web UI)
        run: |
          pyinstaller --onefile --windowed --name ShipTones \
            --add-data "web:web" \
            --hidden-import=yt_dlp \
            --hidden-import=mutagen \
            --hidden-import=PIL \
            --hidden-import=mutagen.mp3 \
            --hidden-import=mutagen.mp4 \
            --hidden-import=mutagen.flac \
            --hidden-import=mutagen.ogg \
            --collect-all pywebview \
            --clean \
            --noconfirm \
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShipTones-Linux
          path: dist/ShipTones

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          brew install ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable (onefile, with web UI)
        run: |
          pyinstaller --onefile --windowed --name ShipTones \
            --add-data "web:web" \
            --hidden-import=yt_dlp \
            --hidden-import=mutagen \
            --hidden-import=PIL \
            --hidden-import=mutagen.mp3 \
            --hidden-import=mutagen.mp4 \
            --hidden-import=mutagen.flac \
            --hidden-import=mutagen.ogg \
            --collect-all pywebview \
            --clean \
            --noconfirm \
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShipTones-macOS
          path: dist/ShipTones

  create-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ShipTones-Windows
          path: ./artifacts/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: ShipTones-Linux
          path: ./artifacts/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ShipTones-macOS
          path: ./artifacts/macos

      - name: Prepare files for release
        run: |
          mv ./artifacts/windows/ShipTones.exe ./artifacts/ShipTones-Windows.exe
          mv ./artifacts/linux/ShipTones ./artifacts/ShipTones-Linux
          chmod +x ./artifacts/ShipTones-Linux
          mv ./artifacts/macos/ShipTones ./artifacts/ShipTones-macOS
          chmod +x ./artifacts/ShipTones-macOS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/ShipTones-Windows.exe
            ./artifacts/ShipTones-Linux
            ./artifacts/ShipTones-macOS
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
