name: Build ShipTones for Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }
        
    - name: Build EXE
      shell: pwsh
      run: |
        # ФИКС CI: assets/icon.ico в репозитории нет — PyInstaller падал с
        # FileNotFoundError и валил весь шаг (fallback без иконки не успевал
        # выполниться). Иконка теперь добавляется только если файл существует.
        $icon = if (Test-Path "assets/icon.ico") { '--icon="assets/icon.ico"' } else { "" }
        pyinstaller --onefile --windowed --name "ShipTones" $icon main.py
        if (-not (Test-Path "dist/ShipTones.exe")) {
          pyinstaller --onefile --windowed --name "ShipTones" main.py
        }
        if (-not (Test-Path "dist/ShipTones.exe")) { exit 1 }

    - name: Create Draft Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        draft: true
        files: dist/ShipTones.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload Artifact (for manual runs)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: ShipTones-Windows
        path: dist/ShipTones.exe
        retention-days: 30
